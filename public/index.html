<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f1a" />
  <title>SMART Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
            <path d="M12 3l2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4L12 3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>SMART Chat</h1>
          <p>对话 · 图片生成</p>
        </div>
      </div>

      <button type="button" class="btn new-chat" id="btn-new">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        新对话
      </button>

      <label class="field">
        <span class="field-label">模型</span>
        <div class="select-wrap">
          <select id="model-select">
            <optgroup label="对话模型">
              <option value="nvidia/nemotron-3-ultra-550b-a55b:free" selected>Nemotron 3 Ultra 550B（免费）</option>
              <option value="nvidia/nemotron-3.5-lightning:free">Nemotron 3.5 Lightning（免费）</option>
              <option value="nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free">Nemotron 3 Nano Omni Reasoning（免费）</option>
              <option value="nvidia/nemotron-3.5-super-vl:free">Nemotron 3.5 Super VL（免费·可看图）</option>
              <option value="nvidia/nemotron-3.5-content-safety:free">Nemotron 3.5 Content Safety（免费）</option>
              <option value="recursive/flint-v1.0:free">Flint v1.0（免费·写代码）</option>
              <option value="openrouter/free">OpenRouter Free Router（免费）</option>
              <option value="poolside/laguna-s-2.1:free">Poolside Laguna S 2.1（免费）</option>
              <option value="xingchen-agi/xing4.0-29b-a4b:free">星辰 Xing4.0 29B（免费）</option>
              <option value="cohere/north-mini-code:free">Cohere North Mini Code（免费）</option>
              <option value="dots-studio/dots-3-note-preview:free">Dots3 Note Preview（免费）</option>
              <option value="zhipu/glm-4.7-flash">GLM-4.7-Flash（智谱免费）</option>
              <option value="z-ai/glm-4.7-flash">GLM-4.7-Flash（OpenRouter 按量）</option>
            </optgroup>
            <optgroup label="图片模型">
              <option value="black-forest-labs/flux-3-image-klein">FLUX 3 Image Klein（便宜）</option>
              <option value="black-forest-labs/flux-3-image">FLUX 3 Image</option>
              <option value="qwen/qwen-image-2.1-turbo">Qwen Image 2.1 Turbo</option>
              <option value="google/gemini-nano-banana-2.1">Nano Banana 2.1</option>
              <option value="bytedance-seed/seedream-5-0-flash">Seedream 5.0 Flash</option>
              <option value="meta/muse-image">Muse Image</option>
            </optgroup>
          </select>
          <svg class="select-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true">
            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </label>

      <div class="sidebar-footer">
        <button type="button" class="btn danger block" id="btn-clear">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true">
            <path d="M4 7h16M9 7V5h6v2M8 7l1 12h6l1-12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          清空历史
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button type="button" class="btn icon" id="btn-menu" aria-label="菜单">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
            <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="topbar-title">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="model-label">Nemotron 3 Ultra 550B（免费）</span>
        </div>
        <button type="button" class="btn ghost compact" id="btn-new-mobile">新对话</button>
      </header>

      <div class="messages" id="messages" role="log" aria-live="polite"></div>

      <div class="composer-wrap">
        <form class="composer" id="composer">
          <textarea
            id="input"
            rows="1"
            placeholder="输入消息… Enter 发送，Shift+Enter 换行"
            autocomplete="off"
          ></textarea>
          <button type="submit" class="btn send" id="btn-send" aria-label="发送">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
              <path d="M5 12h12M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
        <p class="composer-hint">内容由 AI 生成，请核实重要信息</p>
      </div>
    </main>
  </div>
  <div class="overlay" id="overlay" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
